[package]
name = "macrobench"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/soqb/vermouth"

[dependencies]
anyhow = "1.0.100"
crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
facet = { version = "0.41.0", default-features = false, optional = true }
facet-json = { version = "0.41.0", default-features = false, optional = true }
ratatui = { version = "0.30.0", features = ["crossterm_0_29"], optional = true }
smol = "2.0.2"

[features]
default = ["rustc-timings", "tui"]
rustc-timings = ["dep:facet", "dep:facet-json"]
tui = ["dep:ratatui", "dep:crossterm"]
