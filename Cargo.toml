[package]
name = "vermouth"
version = "0.4.0"
edition = "2024"
description = "a new kind of parser for procedural macros"
license = "MIT OR Apache-2.0"
repository = "https://github.com/soqb/vermouth"
rust-version = "1.92"
exclude = ["assets/"]
autobenches = false

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "examples/toy",
    "examples/toy/macros",
    "macrobench",
    "benches",
    "benches/compile-fodder/*",
    "benches/compile-fodder/*/upstream",
]

[workspace.dependencies]
smallvec = { version = "1.13.2", features = ["union"] }
document-features = { version = "0.2.10" }
vermouth = { version = "0.4.0", path = "." }
macrobench = { version = "0.1.0", path = "macrobench" }

[workspace.dependencies.proc-macro2]
# we lock the version to a range since there's no tangible guarantee
# that `proc-macro2` matches `proc_macro` in enough detail.
version = ">=1.0.103, <=1.0.104"

[workspace.lints.clippy]
toplevel_ref_arg = "allow"
type_complexity = "allow"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"

# [workspace.lints.rust]
# missing_docs = "warn"

[dependencies]
smallvec = { workspace = true }
document-features = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }

[features]
default = ["quote"]

# NB: we use the `document_features` crate.
#! ## Stable Features

## Enables the complete suite of parsing utilities.
complete = ["quote", "attributes", "warnings"]
## Enables [quasi quoting](crate::quote!).
quote = []
## Enables [parsing](crate::Parser).
parse = []
## Provides support and utilities for parsing and handling Rust attributes.
attributes = ["parse"]
## Enables emitting diagnostic warnings through the [`Diagnostic`] API.
warnings = []
## Rewires this crate to build on top of the [`proc-macro2`] crate,
## instead of the default, officially supported `proc_macro` crate.
##
## <div class="warning">
##
## This feature should be enabled with caution, and it is considered a major breaking change to do so.
## Due to the risks of compounding additive features across dependencies,
## it can be problematic to enable this feature in a library, since it may break other dependents of this crate.
##
## </div>
##
## [`proc-macro2`]: https://crates.io/crates/proc-macro2
proc-macro2 = ["dep:proc-macro2", "proc-macro2/span-locations"]

#! ## Unstable Features <i>(nightly)</i>

## Enables the standard library's experimental
## <a class="stab portability" href="https://github.com/rust-lang/rust/issues/54140"><code>proc_macro_diagnostic</code></a>
## feature for higher quality diagnostics.
unstable-diagnostics-backend = []

# do not enable. used for docs.rs only.
internal-document-features = ["dep:document-features"]

[package.metadata.docs.rs]
features = ["complete", "internal-document-features"]

[package.metadata.cargo-all-features]
skip_feature_sets = [
    ["internal-document-features"],
    ["proc-macro2", "unstable-diagnostics-backend"],
]
